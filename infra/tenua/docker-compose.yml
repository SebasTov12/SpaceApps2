name: tenua

services:
  tenua:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: tenua-frontend:latest
    restart: unless-stopped
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    networks:
      orivia_private:
        aliases:
          - tenua

networks:
  orivia_private:
    external: true
    name: ${ORIVIA_DOCKER_NETWORK:-orivia-server_orivia_private}
