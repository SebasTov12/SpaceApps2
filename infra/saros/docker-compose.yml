name: spaceapps2

services:
  saros:
    container_name: spaceapps2-saros
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SAROS_API: ${SAROS_API_PUBLIC_URL:-https://saros.tobaru.xyz}
    image: ghcr.io/sebastov12/spaceapps2-saros:${SAROS_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Orivia has 2 vCPUs / 2 GiB RAM. Keep about 0.75 CPU and 0.5 GiB free
    # for Debian, Caddy, Docker and short host maintenance spikes.
    cpus: 0.25
    mem_limit: 320m
    environment:
      SAROS_INTERNAL_API_URL: http://spaceapps2-api:8000
      SAROS_ASSISTANT_TOKEN: ${SAROS_ASSISTANT_TOKEN:-}
      SAROS_PREDICTION_TOKEN: ${SAROS_PREDICTION_TOKEN:-}
      SAROS_ENABLE_MODEL_ACTIONS: ${SAROS_ENABLE_MODEL_ACTIONS:-false}
      SAROS_MODEL_TOOLS_ACCESS_KEY: ${SAROS_MODEL_TOOLS_ACCESS_KEY:-}
      SAROS_MODEL_TOOLS_SESSION_SECRET: ${SAROS_MODEL_TOOLS_SESSION_SECRET:-}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    networks:
      saros_private: {}
      orivia_private:
        aliases:
          - saros

  api:
    container_name: spaceapps2-api
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: ghcr.io/sebastov12/spaceapps2-api:${SAROS_IMAGE_TAG:-latest}
    restart: unless-stopped
    cpus: 0.30
    mem_limit: 384m
    environment:
      # `postgres` is already aliased to Orivia's separate `orivia` database
      # on the shared proxy network. Use SAROS's existing database container.
      SAROS_DB_HOST: spaceapps2-postgres
      SAROS_DB_PORT: "5432"
      SAROS_DB_NAME: ${SAROS_POSTGRES_DB:-spaceapps2}
      SAROS_DB_USER: ${SAROS_POSTGRES_USER:-spaceapps2_admin}
      SAROS_DB_PASSWORD: ${SAROS_POSTGRES_PASSWORD:?Set SAROS_POSTGRES_PASSWORD in the server .env}
      SAROS_MODEL_URL: http://predictor:8001
      SAROS_PREDICTION_TOKEN: ${SAROS_PREDICTION_TOKEN:?Set SAROS_PREDICTION_TOKEN in the server .env}
      SAROS_ASSISTANT_TOKEN: ${SAROS_ASSISTANT_TOKEN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_API_URL: https://api.groq.com/openai/v1/chat/completions
      SAROS_MAX_REQUEST_BYTES: ${ML_MAX_REQUEST_BYTES:-33554432}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      predictor:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    init: true
    networks:
      saros_private: {}
      orivia_private:
        aliases:
          - spaceapps2-api

  postgres:
    container_name: spaceapps2-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    cpus: 0.35
    mem_limit: 384m
    environment:
      POSTGRES_DB: ${SAROS_POSTGRES_DB:-spaceapps2}
      POSTGRES_USER: ${SAROS_POSTGRES_USER:-spaceapps2_admin}
      POSTGRES_PASSWORD: ${SAROS_POSTGRES_PASSWORD:?Set SAROS_POSTGRES_PASSWORD in the server .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - saros_private

  nisar-migrate:
    profiles: [migration]
    image: postgres:16-alpine
    cpus: 0.20
    mem_limit: 256m
    environment:
      PGHOST: spaceapps2-postgres
      PGPORT: "5432"
      PGDATABASE: ${SAROS_POSTGRES_DB:-spaceapps2}
      PGUSER: ${SAROS_POSTGRES_USER:-spaceapps2_admin}
      PGPASSWORD: ${SAROS_POSTGRES_PASSWORD:?Set SAROS_POSTGRES_PASSWORD in the server .env}
    volumes:
      - ../../pipeline/sql:/migrations:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/004_nisar_forecast.sql", "-f", "/migrations/006_real_data_ingestion.sql", "-f", "/migrations/007_composite_model.sql", "-f", "/migrations/008_assistant_interactions.sql", "-f", "/migrations/009_colombia_territorial_exposure.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saros_private
    restart: "no"

  predictor:
    container_name: spaceapps2-model
    build:
      context: ../../ml/nisar_change
      dockerfile: Dockerfile.inference
    image: ghcr.io/sebastov12/spaceapps2-nisar-model:${SAROS_IMAGE_TAG:-latest}
    restart: unless-stopped
    cpus: 0.35
    mem_limit: 384m
    environment:
      MODEL_PATH: /models/nisar-change/best.onnx
      ML_THRESHOLD: ${ML_THRESHOLD:-0.5}
      ML_MAX_REQUEST_BYTES: ${ML_MAX_REQUEST_BYTES:-33554432}
      ML_MAX_PIXELS: ${ML_MAX_PIXELS:-262144}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - ../../models/nisar-change:/models/nisar-change:ro
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    init: true
    networks:
      saros_private:
        aliases:
          - nisar-model

  trainer:
    profiles: [training]
    build:
      context: ../../ml/nisar_change
      dockerfile: Dockerfile
    image: spaceapps2-nisar-trainer:latest
    cpus: 0.40
    mem_limit: 448m
    environment:
      ML_MANIFEST: ${ML_MANIFEST:-./data/filtered/manifest.parquet}
      ML_OUTPUT_DIR: /workspace/models/nisar-change
      ML_INPUT_CHANNELS: ${ML_INPUT_CHANNELS:-2}
      ML_BASE_CHANNELS: ${ML_BASE_CHANNELS:-16}
      ML_BATCH_SIZE: ${ML_BATCH_SIZE:-4}
      ML_EPOCHS: ${ML_EPOCHS:-30}
      ML_LEARNING_RATE: ${ML_LEARNING_RATE:-0.0003}
      ML_DEVICE: ${ML_DEVICE:-auto}
      ML_THRESHOLD: ${ML_THRESHOLD:-0.5}
      ML_RANDOM_SEED: ${ML_RANDOM_SEED:-42}
      ML_SPLIT_STRATEGY: ${ML_SPLIT_STRATEGY:-spatiotemporal}
    volumes:
      - ../../data:/workspace/data:ro
      - ../../models:/workspace/models
    init: true
    restart: "no"

  processor:
    profiles: [processing]
    build:
      context: ../..
      dockerfile: pipeline/Dockerfile
    image: spaceapps2-nisar-processor:latest
    cpus: 0.20
    mem_limit: 320m
    working_dir: /workspace
    entrypoint: ["python"]
    command: ["scripts/filter_nisar_colombia.py"]
    user: "1000:1000"
    environment:
      EARTHDATA_USERNAME: ${EARTHDATA_USERNAME:-}
      EARTHDATA_PASSWORD: ${EARTHDATA_PASSWORD:-}
      EARTHDATA_AUTH_STRATEGY: ${EARTHDATA_AUTH_STRATEGY:-environment}
      NISAR_PROCESSING_LEVEL: ${NISAR_PROCESSING_LEVEL:-GUNW}
      NISAR_PRODUCT_SHORT_NAME: ${NISAR_PRODUCT_SHORT_NAME:-}
      NISAR_DATA_MATURITY: ${NISAR_DATA_MATURITY:-}
      NISAR_START_DATE: ${NISAR_START_DATE:-}
      NISAR_END_DATE: ${NISAR_END_DATE:-}
      NISAR_FILTERED_DIR: /workspace/data/filtered
      NISAR_COLOMBIA_BBOX: ${NISAR_COLOMBIA_BBOX:--82.5,-5,-66.5,14}
      SAROS_API_URL: http://spaceapps2-api:8000
      SAROS_PREDICTION_TOKEN: ${SAROS_PREDICTION_TOKEN:?Set SAROS_PREDICTION_TOKEN in the server .env}
    volumes:
      - ../../data:/workspace/data
      - ../../pipeline/data:/workspace/pipeline/data
      - ../../frontend/public/data:/workspace/frontend/public/data
      - ${SAROS_NISAR_DATA_HOST_PATH:-../../data/nisar}:/home/admin/spaceapps2/data/nisar:ro
    init: true
    restart: "no"
    networks:
      - saros_private
      - saros_egress

networks:
  saros_private:
    internal: true
  # The catalog/download worker needs outbound NASA/ASF HTTPS, but not access
  # to Orivia's application network or the database container.
  saros_egress:
    name: spaceapps2_saros_egress
  orivia_private:
    external: true
    name: ${ORIVIA_DOCKER_NETWORK:-orivia-server_orivia_private}

volumes:
  postgres_data:
    name: spaceapps2_postgres_data
    external: true
