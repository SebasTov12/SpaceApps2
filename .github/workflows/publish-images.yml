name: Publish SAROS images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-saros-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish SAROS frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/sebastov12/spaceapps2-saros:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SAROS_API=https://saros.tobaru.xyz
          labels: |
            org.opencontainers.image.source=https://github.com/SebasTov12/SpaceApps2
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/sebastov12/spaceapps2-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/SebasTov12/SpaceApps2
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish NISAR predictor
        uses: docker/build-push-action@v7
        with:
          context: ./ml/nisar_change
          file: ./ml/nisar_change/Dockerfile.inference
          push: true
          tags: ghcr.io/sebastov12/spaceapps2-nisar-model:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/SebasTov12/SpaceApps2
            org.opencontainers.image.revision=${{ github.sha }}
