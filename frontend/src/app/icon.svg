<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1046"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <radialGradient id="planet" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#9ff6ff"/>
      <stop offset=".45" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ef0ff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- anillo orbital: mitad trasera detrás del planeta -->
  <path d="M8 40 C 10 30, 54 18, 56 26" fill="none" stroke="url(#ring)" stroke-width="3" stroke-linecap="round" opacity=".55" transform="rotate(-4 32 32)"/>
  <circle cx="32" cy="32" r="15" fill="url(#planet)"/>
  <!-- mitad delantera del anillo -->
  <path d="M56 26 C 58 34, 12 48, 8 40" fill="none" stroke="url(#ring)" stroke-width="3.2" stroke-linecap="round" transform="rotate(-4 32 32)"/>
  <!-- haz del radar: del satélite a la superficie -->
  <path d="M50 14 L33 24 L40 31 Z" fill="#5ef0ff" opacity=".45"/>
  <!-- satélite -->
  <circle cx="50" cy="14" r="3.4" fill="#ffffff"/>
  <circle cx="50" cy="14" r="6" fill="none" stroke="#5ef0ff" stroke-width="1.4" opacity=".6"/>
</svg>
